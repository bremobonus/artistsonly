name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "akira/brain/**"

jobs:
  akira:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: akira/package-lock.json
      - run: npm ci
        working-directory: akira
      - run: npm run typecheck
        working-directory: akira
      - run: npm test
        working-directory: akira

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          AKIRA_DASHBOARD_KEY: ci
          AKIRA_INGEST_SECRET: ci
